<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15110c">
  <title>체스 — 장난감 병사 전투</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 45 45%27%3E%3Crect width=%2745%27 height=%2745%27 rx=%279%27 fill=%27%23211a12%27/%3E%3Cpath d=%27M14 35c0-6.5 3.5-9.5 6.5-12.5-3 .8-5.8 1.6-8 .6-2.3-1-2.6-3.8-.8-6.1 2.2-2.9 5.2-5.3 7.3-8.5l1-3 2 3.3c6.2.3 11 5.5 11 13.7 0 5.5-1.8 9.2-2 12.5z%27 fill=%27%23d6b05c%27/%3E%3C/svg%3E">
  <!-- 글꼴 (npm으로 설치된 파일, 오프라인 동작) -->
  <link rel="stylesheet" href="vendor/pretendard/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="vendor/fontsource/cinzel/600.css">
  <link rel="stylesheet" href="vendor/fontsource/cinzel/700.css">
  <link rel="stylesheet" href="vendor/fontsource/nanum-myeongjo/700.css">
  <link rel="stylesheet" href="vendor/fontsource/nanum-myeongjo/800.css">
  <link rel="stylesheet" href="vendor/fontsource/black-han-sans/400.css">
  <link rel="stylesheet" href="vendor/fontsource/stardos-stencil/700.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body data-ui="classic">
  <!-- 홈 화면 배경: 3D 회전 보드 (휴대폰·3D 불가 기기는 정지 배경) -->
  <div class="home-bg" id="home-bg" aria-hidden="true">
    <div class="home-static"></div>
    <div class="home-3d" id="home-3d"></div>
    <div class="home-veil"></div>
  </div>

  <header class="topbar">
    <button class="logo" id="logo" type="button" aria-label="홈으로">
      <span class="logo-mark" id="logo-mark"></span>
      <span class="logo-text"><b>CHESS</b><small>장난감 병사 전투</small></span>
    </button>
    <div class="who" id="who"></div>
  </header>

  <main>
    <!-- 홈 -->
    <section class="screen screen-home" id="screen-home">
      <div class="hero">
        <p class="eyebrow">Toy Soldier Chess</p>
        <h1 class="title">체스</h1>
        <p class="subtitle">고전 전투와 현대전, 장난감 병사들의 체스 대결</p>
        <label class="field hero-field">
          <span>닉네임</span>
          <input id="nickname" maxlength="12" placeholder="닉네임을 입력하세요" autocomplete="nickname">
        </label>
        <div class="menu">
          <button class="menu-btn" type="button" data-go="ai">
            <span class="menu-ic" data-icon="robot"></span>
            <span class="menu-tx"><b>컴퓨터와 대전</b><small>난이도 4단계 AI</small></span>
            <span class="menu-go" data-icon="play"></span>
          </button>
          <button class="menu-btn" type="button" data-go="online">
            <span class="menu-ic" data-icon="globe"></span>
            <span class="menu-tx"><b>온라인 2인 대전</b><small>방 만들기 · 방 참가</small></span>
            <span class="menu-go" data-icon="play"></span>
          </button>
          <button class="menu-btn" type="button" data-go="local">
            <span class="menu-ic" data-icon="users"></span>
            <span class="menu-tx"><b>한 화면 2인 대전</b><small>한 기기에서 번갈아 두기</small></span>
            <span class="menu-go" data-icon="play"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- 규칙 / 게임 설정 -->
    <section class="screen" id="screen-setup" hidden>
      <div class="card wide-card">
        <div class="card-head">
          <button class="icon-btn" type="button" id="setup-back" aria-label="뒤로" data-tip="뒤로"><span data-icon="back"></span></button>
          <h2 id="setup-title">게임 설정</h2>
        </div>
        <div id="setup-mode" class="form-grid"></div>
        <h3 class="section-title">규칙</h3>
        <div id="setup-rules" class="form-grid"></div>
        <div class="actions">
          <button class="btn primary big-cta" type="button" id="setup-go"><span data-icon="play"></span><span id="setup-go-label">시작</span></button>
        </div>
      </div>
    </section>

    <!-- 로비 -->
    <section class="screen" id="screen-lobby" hidden>
      <div class="card wide-card">
        <div class="card-head">
          <button class="icon-btn" type="button" id="lobby-back" aria-label="뒤로" data-tip="뒤로"><span data-icon="back"></span></button>
          <h2>온라인 로비</h2>
          <button class="icon-btn push" type="button" id="lobby-refresh" aria-label="새로고침" data-tip="새로고침"><span data-icon="restart"></span></button>
        </div>
        <div class="join-row">
          <input id="join-code" maxlength="4" placeholder="방 코드 4자리" autocomplete="off" aria-label="방 코드">
          <button class="btn" type="button" id="join-go"><span data-icon="enter"></span>코드로 참가</button>
          <button class="btn primary" type="button" id="lobby-create"><span data-icon="plus"></span>방 만들기</button>
        </div>
        <h3 class="section-title">열린 방</h3>
        <div id="room-list" class="room-list"></div>
      </div>
    </section>

    <!-- 대기실 -->
    <section class="screen" id="screen-room" hidden>
      <div class="card wide-card" id="room-card"></div>
    </section>

    <!-- 게임 -->
    <section class="screen screen-game" id="screen-game" hidden>
      <div class="game-layout">
        <div class="stage">
          <div class="player-bar" id="bar-top"></div>
          <div class="viewport" id="viewport">
            <div class="board" id="board"></div>
            <div class="board3d" id="board3d" hidden></div>
            <div class="view-tools" id="view-tools"></div>
          </div>
          <div class="player-bar" id="bar-bottom"></div>
        </div>
        <aside class="side">
          <div class="status" id="status"></div>
          <div class="draw-offer" id="draw-offer" hidden></div>
          <div class="panel-label">기보</div>
          <div class="moves-wrap"><ol class="moves" id="moves"></ol></div>
          <details class="rules-box">
            <summary>적용된 규칙</summary>
            <div id="game-rules" class="rules-summary"></div>
          </details>
          <div class="action-bar" id="controls"></div>
        </aside>
      </div>
    </section>
  </main>

  <!-- 프로모션 선택 -->
  <div class="modal" id="promo-modal" hidden>
    <div class="modal-box">
      <h3>승진할 기물을 선택하세요</h3>
      <div class="promo-choices" id="promo-choices"></div>
      <button class="btn ghost small" type="button" id="promo-cancel">취소</button>
    </div>
  </div>

  <!-- 게임 종료 -->
  <div class="modal" id="gameover" hidden>
    <div class="modal-box gameover-box">
      <div class="go-icon" id="go-icon"></div>
      <h2 id="go-title"></h2>
      <p class="muted" id="go-text"></p>
      <div class="actions center" id="go-actions"></div>
    </div>
  </div>

  <!-- 확인 -->
  <div class="modal" id="confirm-modal" hidden>
    <div class="modal-box">
      <p id="confirm-text"></p>
      <div class="actions center">
        <button class="btn ghost" type="button" id="confirm-no">취소</button>
        <button class="btn danger" type="button" id="confirm-yes">확인</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="art.js"></script>
  <script src="sound.js"></script>
  <script src="config.js"></script>
  <script src="chess.js"></script>
  <script src="app.js"></script>
  <script type="module" src="board3d.js"></script>
</body>
</html>
